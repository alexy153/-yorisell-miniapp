<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2F3137">
  <title>Yorisell</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F6F6F4"/>
        <stop offset="0.55" stop-color="#B9BCC1"/>
        <stop offset="1" stop-color="#7A7F87"/>
      </linearGradient>
      <clipPath id="star-clip">
        <path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9z"/>
      </clipPath>
    </defs>
  </svg>

  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-core">
      <span class="intro-ring"></span>
      <img class="intro-logo" src="assets/logo.jpg" alt="">
    </div>
    <p class="intro-title">Yorisell</p>
  </div>

  <div class="app">
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>
    <div class="blob blob-c" aria-hidden="true"></div>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar yo-rim" aria-label="Разделы" style="--i: 2">
      <span class="lens" aria-hidden="true"></span>
      <button class="tab" type="button" data-tab="favorites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Избранное</span>
      </button>
      <button class="tab" type="button" data-tab="catalog" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>Все товары</span>
      </button>
      <button class="tab" type="button" data-tab="info">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg>
        <span>Инфо</span>
      </button>
    </nav>

    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <div id="zoom" class="zoom" hidden role="dialog" aria-modal="true" aria-label="Фото">
      <img id="zoom-img" alt="">
    </div>
  </div>

  <script src="no-zoom.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
