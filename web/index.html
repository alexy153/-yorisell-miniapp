<!doctype html>
<html lang="ru" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAFAFA">
  <title>Yorisell</title>
  <script>
    // Тема выбирается до первой отрисовки, чтобы не было вспышки. Каждое открытие приложения начинается со светлой; переключение
      // на тёмную помнится только до закрытия приложения.
    (function () {
      var theme = "light";
      try { if (sessionStorage.getItem("theme") === "dark") theme = "dark"; localStorage.removeItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = theme;
      // Страховка: если скрипт приложения не запустился, заставка и скрытое меню не должны остаться навсегда.
      setTimeout(function () {
        var intro = document.getElementById("intro");
        if (intro) intro.remove();
        document.documentElement.classList.remove("booting");
      }, 7000);
    })();
  </script>
  <link rel="preload" href="assets/logo-s.webp" as="image" type="image/webp">
  <link rel="preload" href="fonts/unbounded-lat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/oswald-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Шапка и фон Telegram сразу белые, не дожидаясь загрузки приложения.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || document.documentElement.dataset.theme === "dark") return;
      try { tg.setHeaderColor("#FAFAFA"); tg.setBackgroundColor("#FAFAFA"); tg.setBottomBarColor && tg.setBottomBarColor("#FAFAFA"); } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-bg"></div>
    <canvas class="intro-canvas"></canvas>
  </div>

  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Разделы" style="--i: 2">
      <span class="tab-glider" aria-hidden="true"></span>
      <button class="tab" type="button" data-tab="favorites">
        <span class="tab-ico"><svg class="ic ic-heart" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>
        <span class="tab-label">Избранное</span>
      </button>
      <button class="tab" type="button" data-tab="catalog" aria-current="page">
        <span class="tab-ico"><svg class="ic ic-grid" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><g class="grid-turn"><rect class="sq s1" x="3" y="3" width="7" height="7" rx="2"/><rect class="sq s2" x="14" y="3" width="7" height="7" rx="2"/><rect class="sq s3" x="14" y="14" width="7" height="7" rx="2"/><rect class="sq s4" x="3" y="14" width="7" height="7" rx="2"/></g></svg></span>
        <span class="tab-label">Все товары</span>
      </button>
      <button class="tab" type="button" data-tab="info">
        <span class="tab-ico"><svg class="ic ic-info" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle class="info-ring" cx="12" cy="12" r="9" stroke-dasharray="3.6 3.47"/><path class="info-stem" d="M12 11v5"/><path class="info-dot" d="M12 7.5h.01"/></svg></span>
        <span class="tab-label">Инфо</span>
      </button>
    </nav>

    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <div id="zoom" class="zoom" hidden role="dialog" aria-modal="true" aria-label="Фото">
      <img id="zoom-img" alt="">
    </div>
  </div>

  <script src="no-zoom.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
