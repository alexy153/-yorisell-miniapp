# Выкладка и сборка фото. Тесты идут перед каждой выкладкой.
# - push в main: тесты и выкладка;
# - по расписанию (каждые 30 минут, со смещением к расписанию канала): собираем фото из канала
#   и выкладываем, только если что-то изменилось;
# - вручную: кнопка «Run workflow».
# Секреты и переменные (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (секрет) — токен Cloudflare с правами Workers и D1
#   CLOUDFLARE_ACCOUNT_ID (секрет) — ID аккаунта Cloudflare
#   D1_DATABASE_ID        (переменная) — ID базы D1, в репозитории его нет
name: Выкладка и фото

on:
  push:
    branches: [main]
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Прошлая сборка фото: чтобы не перекодировать то, что не изменилось.
      - uses: actions/cache@v4
        with:
          path: |
            web/media
            .media-state
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: Собрать фото (две версии WebP)
        id: media
        run: node --no-warnings scripts/build-media.mjs

      - name: Подставить ID базы D1
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node -e "const fs=require('fs');const p='wrangler.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/database_id = \".*\"/,'database_id = \"'+process.env.D1_DATABASE_ID+'\"'))"

      - name: Выложить на Cloudflare
        if: steps.media.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
